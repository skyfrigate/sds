# docs/conf/.readthedocs.yaml
# Read the Docs configuration file located in docs/conf/
# See https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

# Set the OS, Python version and other tools you might need
build:
  os: ubuntu-22.04
  tools:
    python: "3.10"  # Aligned with requires-python >= 3.10 in pyproject.toml

# Build documentation in the docs/ directory with Sphinx
# IMPORTANT: All paths are relative to the repository ROOT, not this file
sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: false  # Set to true in production to enforce quality

# Optionally build your docs in additional formats
formats:
  - pdf
  - epub

# Python configuration
python:
  install:
    # Install documentation dependencies
    # Path relative to the repository root
    - requirements: docs/source/requirements.txt
    # Install your package from src/
    # The "." is relative to the repository root
    - method: pip
      path: .

# Submodules configuration (if you use git submodules)
# submodules:
#   include: []
#   recursive: false

# Search configuration (optional)
search:
  ranking:
    'api/*': -1  # Give less weight to API pages in search results
  ignore:
    - 'changelog/deprecated.rst'  # Ignore deprecated pages