[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pysds-tools"
version = "0.7.0"
description = "Tools for using and manipulating simple basic data structures"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE.md"]
authors = [
    { name = "skyfrigate" },
    { name = "biface" },
]
keywords = [
    "data-structures",
    "algorithms",
    "education",
    "graph",
    "tree",
    "probabilistic-graphical-models",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
]

[project.urls]
Homepage = "https://github.com/skyfrigate/sds"
Repository = "https://github.com/skyfrigate/sds"
Documentation = "https://pysds-tools.readthedocs.io"
"Bug Tracker" = "https://github.com/skyfrigate/sds/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sds = ["py.typed"]

[dependency-groups]
dev = [
    "bandit>=1.8.6",
    "black>=25.12.0",
    "isort>=7.0.0",
    "lint>=1.2.1",
    "mypy>=1.19.0",
    "pyrefly>=0.45.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff==0.14.8",
    "tox>=4.32.0",
    "tox-uv>=1.29.0",
]
docs = [
    "furo>=2024.8.6",
    "myst-parser>=4.0.1",
    "sphinx>=8.1.3",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.6.1",
    "sphinx-intl>=2.3.2",
    "sphinx-tabs>=3.4.7",
    "sphinxcontrib-mermaid>=2.0.0rc1",
]
release = [
    "build>=1.2.2",
    "twine>=6.0.1",
]

[tool.coverage.xml]
output = "coverage/coverage.xml"
