[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pysds-tools"
version = "0.8.0rc1"
description = "Tools for using and manipulating simple basic data structures"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE.md"]
authors = [
    { name = "skyfrigate" },
    { name = "biface" },
]
keywords = [
    "data-structures",
    "algorithms",
    "education",
    "graph",
    "tree",
    "probabilistic-graphical-models",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
image = [
    "matplotlib>=3.10",
]
yaml = [
    "pyyaml>=6.0",
]

[project.scripts]
pysds = "sds.utils.cli:main"

[project.urls]
Homepage = "https://github.com/skyfrigate/sds"
Repository = "https://github.com/skyfrigate/sds"
Documentation = "https://pysds-tools.readthedocs.io"
"Bug Tracker" = "https://github.com/skyfrigate/sds/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sds = ["py.typed"]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "black>=26.10.1",
    "isort>=9.0.2",
    "lint>=1.2.1",
    "mypy>=2.4.0",
    "pyrefly>=1.3.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff==0.15.22",
    "tox>=4.65.3",
    "tox-uv>=1.37.0",
]
docs = [
    "furo>=2025.12.19",
    "myst-parser>=5.1.0",
    "sphinx>=9.0.4",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.7.0",
    "sphinx-intl>=2.4.0",
    "sphinx-tabs>=3.5.0",
    "sphinxcontrib-mermaid>=2.1.1",
]
release = [
    "build>=1.6.1",
    "twine>=7.0.0",
]

[tool.coverage.xml]
output = "coverage/coverage.xml"
